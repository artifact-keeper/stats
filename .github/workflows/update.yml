name: Update stats

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      debug_token:
        description: "Print what the STATS_TOKEN can access (no secrets are echoed)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Debug token access
        if: ${{ inputs.debug_token }}
        env:
          TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          [ -n "$TOKEN" ] && echo "STATS_TOKEN is set" || echo "STATS_TOKEN is EMPTY"
          for path in user repos/artifact-keeper/artifact-keeper repos/artifact-keeper/artifact-keeper/stargazers?per_page=1 repos/artifact-keeper/artifact-keeper/traffic/views repos/artifact-keeper/artifact-keeper/forks?per_page=1; do
            echo "== $path"
            curl -s -o /tmp/body -D /tmp/h -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/$path"
            grep -i -E '^(HTTP|x-accepted-github-permissions|x-oauth-scopes|x-github-request-id)' /tmp/h
            head -c 200 /tmp/body; echo
          done

      - name: Debug Cloudflare access
        if: ${{ inputs.debug_token }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          [ -n "$CF_TOKEN" ] && echo "CLOUDFLARE_API_TOKEN is set" || echo "CLOUDFLARE_API_TOKEN is EMPTY"
          [ -n "$CF_ZONE" ] && echo "CLOUDFLARE_ZONE_ID is set" || echo "CLOUDFLARE_ZONE_ID is EMPTY"
          echo "== token verify"
          curl -s -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | head -c 300; echo
          echo "== zone visible?"
          curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones/$CF_ZONE" | head -c 200; echo
          echo "== graphql"
          curl -s -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" https://api.cloudflare.com/client/v4/graphql \
            --data "{\"query\":\"{ viewer { zones(filter:{zoneTag:\\\"$CF_ZONE\\\"}) { httpRequests1dGroups(limit:2, filter:{date_geq:\\\"$(date -u -d '-3 days' +%F)\\\"}) { dimensions { date } sum { requests } } } } }\"}" | head -c 600; echo

      - name: Collect, chart, write README
        timeout-minutes: 20
        env:
          # STATS_TOKEN: a fine-grained PAT with Administration:read (for traffic)
          # on the tracked repos. Falls back to GITHUB_TOKEN, which collects
          # everything except views/clones.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          # Optional: Cloudflare zone analytics for installs-by-country
          # (token scope: Zone > Analytics > Read).
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          uv sync --quiet --extra globe
          uv run ak-stats all

      # The spinning globe GIF needs headless Chromium with software WebGL. It is
      # best-effort: if it fails or stalls, the previous GIF stays and the
      # numbers above still get committed.
      - name: Render globe GIF
        timeout-minutes: 15
        continue-on-error: true
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          timeout 300 uv run playwright install --with-deps chromium >/dev/null
          timeout 600 uv run ak-stats globe

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data charts badges README.md latest.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "stats: $(date -u +%Y-%m-%d) snapshot"
          git push
